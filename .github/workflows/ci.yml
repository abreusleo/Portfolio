name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The mural backend (msg.leo-abreu.com). Anonymous write surface, so it earns its
  # own build/test/scan.
  recados:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/recados
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/recados/go.mod
          cache-dependency-path: server/recados/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # A broken bundle is a broken room; build it on every PR so a bad merge is
      # caught here rather than on Pages.
      - run: npm run build
